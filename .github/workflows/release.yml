name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Same Ubuntu gate as pull requests (build.yml `checks`). xvfb e2e is Linux-only,
  # so the installer job waits on this instead of trying to run it on windows-latest.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Ensure the Electron binary was downloaded (npm cache can restore the package without dist/).
      - run: node ./node_modules/electron/install.js
      # End-to-end smoke test drives the real Electron app under a virtual
      # display; install the shared system libraries it needs, then run headless.
      - run: npx playwright install-deps
      - run: xvfb-run -a npm run test:e2e

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # electron-builder --publish never: this job builds the installer and latest.yml,
      # then action-gh-release uploads the .exe, .yml, and .blockmap (needed for in-app updates).
      - run: npm run dist
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tableside-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
