name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # electron-builder --publish never: this job builds the installer and latest.yml,
      # then action-gh-release uploads the .exe, .yml, and .blockmap (needed for in-app updates).
      - run: npm run dist
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: tableside-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
