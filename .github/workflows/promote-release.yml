name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mark as Latest (for example v1.8.10)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote tag to stable Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Expected a v* tag such as v1.8.10"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
