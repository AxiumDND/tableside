name: Feature request
description: Suggest something that helps an in-person DM laptop + player TV night
title: '[feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Tableside is **table-first**: a laptop DM console + player TV for
        people in the **same room**. It is **not** a full VTT for online play.

        Prefer ideas that help in-person nights. Cloud accounts, remote
        players, browser clients, and Foundry-style online tooling are out of
        scope — see [docs/ROADMAP.md](../../docs/ROADMAP.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem at the table
      description: What is awkward or slow during prep or play?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed idea
      description: What would you want Tableside to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Maps / fog / tokens
        - Combat / initiative
        - Player TV / handouts
        - Game night sheets / notes
        - Lookup / Tools
        - Music / audio
        - Docs / Help
        - Other systems (PF2e / V5)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This helps an in-person table (laptop + TV in the same room), not online/remote play
          required: true
      - label: This does not need accounts, cloud sync, or a browser player client
          required: true
